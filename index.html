<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="ROT13（13文字ずらしのシフト暗号）を置換表で学べるツール。入力と同時に変換し、対応する文字をハイライトする">
    <title>ROT13エンコーダー（ROT13 Encoder）</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <div class="toolbar">
            <button class="lang-button" id="langToggle" type="button" data-i18n="app.langButton" data-i18n-aria-label="app.langAria" aria-label="言語を切り替える">English</button>
        </div>
        <h1><span aria-hidden="true">🔐</span> <span data-i18n="app.heading">ROT13エンコーダー（ROT13 Encoder）</span></h1>
        <noscript><span lang="ja">このツールの利用には JavaScript が必要です。</span> / <span lang="en">This tool requires JavaScript.</span></noscript>

        <div class="cipher-tables">
            <div class="cipher-table">
                <h2 class="table-title" data-i18n="table.upper">大文字</h2>
                <div class="cipher-grid" id="upper-grid" role="list" data-i18n-aria-label="table.upperAria" aria-label="大文字の置換表"></div>
            </div>
            <div class="cipher-table">
                <h2 class="table-title" data-i18n="table.lower">小文字</h2>
                <div class="cipher-grid" id="lower-grid" role="list" data-i18n-aria-label="table.lowerAria" aria-label="小文字の置換表"></div>
            </div>
        </div>
        <p class="table-legend" data-i18n="table.legend">上段が入力の文字、下段がROT13で変換した文字。入力に含まれる文字は、黄色と太枠で強調される。</p>

        <label for="input" data-i18n="input.label">📝 入力テキスト:</label>
        <div class="input-group">
            <textarea id="input" data-i18n-placeholder="input.placeholder" placeholder="ここに文字を入力してください">Hello World!</textarea>
            <div class="actions">
                <button class="btn clear" id="clearBtn" type="button" data-i18n="button.clear">クリア</button>
            </div>
        </div>

        <label for="output" data-i18n="output.label">🔒 変換結果:</label>
        <div class="input-group">
            <textarea id="output" readonly aria-describedby="stats"></textarea>
            <div class="actions">
                <button class="btn swap" id="swapBtn" type="button" data-i18n="button.swap">結果を入力へ</button>
                <button class="btn copy" id="copyBtn" type="button" data-i18n="button.copy">コピー</button>
            </div>
        </div>
        <p id="stats" class="stats"></p>
        <p id="hint" class="hint" role="status" hidden data-i18n="hint.fullwidth">全角の英字は変換されません。ROT13の対象は半角のA〜Zとa〜zだけです。</p>
        <p id="statusMessage" class="status" role="status" aria-live="polite"></p>

        <div class="note">
            <strong data-i18n="note.title">💡 ROT13について:</strong><br>
            <span data-i18n="note.body">アルファベットを13文字ずらす暗号です。入力した文字が置換表でハイライトされます。</span>
        </div>
    </main>

    <footer class="site-footer">
        <a href="https://github.com/ipusiron/rot13-encoder" data-i18n="footer.repo">GitHubでソースコードを見る</a>
    </footer>

    <script src="i18n.js" defer></script>
    <script src="rot13.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
